name: Test and deploy site

# Nothing goes live unless the tests pass: the "deploy" job only starts after the "test" job succeeds.
# One-time setup in GitHub: Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the site (also checks the installer download link exists)
        run: node --test tests/site.test.js tests/selftest.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site files (tests and workflow files are not published)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude '_site' --exclude 'README.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
